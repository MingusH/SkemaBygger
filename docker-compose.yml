    #volumes:
      #- postgres_data:/var/lib/postgresql/data
      #- ./init.sql:/docker-entrypoint-initdb.d/init.sql
    #restart: unless-stopped

  backend:
    networks:
      - allstuff
    build: ./backend
    container_name: skema_backend
    environment:
      DATABASE_URL: postgresql://skema_user:skema_password@postgres:5432/skema_db
      SECRET_KEY: your-secret-key-change-in-production
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
    volumes:
      - ./backend:/app
    restart: unless-stopped
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    networks:
      - allstuff
    build: ./frontend
    container_name: skema_frontend
    depends_on:
      - backend
    restart: unless-stopped
    ports:
      - 80:80
    environment:
      - REACT_APP_API_URL=/api
      - VIRTUAL_HOST=skemabygger.dk
      - VIRTUAL_PORT=80
      - LETSENCRYPT_HOST=skemabygger.dk
      - LETSENCRYPT_EMAIL=mingusfhellstrom@gmail.com

volumes:
  postgres_data:

networks:
  allstuff:
    name: allstuff_default
    external: true
