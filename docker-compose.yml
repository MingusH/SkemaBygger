services:
  #postgres:
    #image: postgres:15
    #container_name: skema_postgres
    #environment:
      #POSTGRES_DB: skema_db
      #POSTGRES_USER: skema_user
      #POSTGRES_PASSWORD: skema_password
    #ports:
      #- "5432:5432"
    #volumes:
      #- postgres_data:/var/lib/postgresql/data
      #- ./init.sql:/docker-entrypoint-initdb.d/init.sql
    #restart: unless-stopped

  backend:
    networks:
      - allstuff
    build: ./backend
    container_name: skema_backend
    environment:
      DATABASE_URL: postgresql://skema_user:skema_password@postgres:5432/skema_db
      SECRET_KEY: your-secret-key-change-in-production
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
    ports:
      - "8000:8000"
    #depends_on:
      #- postgres
    volumes:
      - ./backend:/app
    restart: unless-stopped
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    networks:
      - allstuff
    build: ./frontend
    container_name: skema_frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    restart: unless-stopped
    environment:
      - REACT_APP_API_URL=http://localhost:8000
      - VIRTUAL_HOST=skemabygger.dk
      - VIRTUAL_PORT=3000
      - LETSENCRYPT_HOST=skemabygger.dk
      - LETSENCRYPT_EMAIL=mingusfhellstrom@gmail.com

  nginx:
    image: nginx:alpine
    container_name: skema_nginx
    networks:
      - allstuff
    depends_on:
      - frontend
      - backend
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    environment:
      - VIRTUAL_HOST=skemabygger.dk
      - VIRTUAL_PORT=80
      - LETSENCRYPT_HOST=skemabygger.dk
      - LETSENCRYPT_EMAIL=mingusfhellstrom@gmail.com
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  allstuff:
    name: allstuff_default
    external: true